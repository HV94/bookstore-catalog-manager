<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0d1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow_19" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="8" fill="url(#grad_19)" />
  
  <!-- Outer subtle border -->
  <rect x="6" y="6" width="388" height="228" rx="6" fill="none" stroke="#f472b6" stroke-width="1.2" opacity="0.3" />

  <!-- Left spine band -->
  <rect x="0" y="0" width="12" height="240" fill="#000000" opacity="0.35" />
  <line x1="12" y1="0" x2="12" y2="240" stroke="#f472b6" stroke-width="1" opacity="0.25" />

  <!-- Publisher Badge (Centered between top buttons and genre tag) -->
  <g transform="translate(70, 10)">
    <rect x="0" y="0" width="120" height="20" rx="4" fill="#f472b6" opacity="0.2"/>
    <rect x="0" y="0" width="120" height="20" rx="4" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.6"/>
    <text x="60" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#f472b6" letter-spacing="1">OSCAR CLASSICI MONDADORI</text>
  </g>

  <!-- Left Content: Title, Subtitle, Author -->
  <g transform="translate(26, 62)">
    <!-- Author -->
    <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Jane Austen</text>
    
    <!-- Title -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3" filter="url(#shadow_19)">Orgoglio e Pregiudizio</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Elizabeth Bennet &amp; Mr. Darcy</text>
    
    <!-- Accent Line -->
    <line x1="0" y1="84" x2="45" y2="84" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Right Motif Artwork -->
  <g id="motif_19">
    <ellipse cx="310" cy="125" rx="52" ry="42" fill="#3b1731" stroke="#f472b6" stroke-width="3"/>
            <text x="310" y="125" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#fbcfe8">Elizabeth</text>
            <text x="310" y="142" text-anchor="middle" font-family="serif" font-size="10" fill="#f472b6">&amp; Darcy</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(26, 214)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1">EDIZIONE ITALIANA</text>
    <text x="350" y="16" text-anchor="end" font-family="monospace" font-size="8.5" fill="#f472b6">VOL #19</text>
  </g>
</svg>