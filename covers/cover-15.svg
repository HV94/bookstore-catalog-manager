<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow_15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="8" fill="url(#grad_15)" />
  
  <!-- Outer subtle border -->
  <rect x="6" y="6" width="388" height="228" rx="6" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.3" />

  <!-- Left spine band -->
  <rect x="0" y="0" width="12" height="240" fill="#000000" opacity="0.35" />
  <line x1="12" y1="0" x2="12" y2="240" stroke="#10b981" stroke-width="1" opacity="0.25" />

  <!-- Publisher Badge (Centered between top buttons and genre tag) -->
  <g transform="translate(70, 10)">
    <rect x="0" y="0" width="120" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="0" width="120" height="20" rx="4" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="60" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#10b981" letter-spacing="1">SPERLING &amp; KUPFER</text>
  </g>

  <!-- Left Content: Title, Subtitle, Author -->
  <g transform="translate(26, 62)">
    <!-- Author -->
    <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Luca Mazzucchelli</text>
    
    <!-- Title -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3" filter="url(#shadow_15)">Fattore 1%</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Piccole abitudini, grandi risultati</text>
    
    <!-- Accent Line -->
    <line x1="0" y1="84" x2="45" y2="84" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Right Motif Artwork -->
  <g id="motif_15">
    <rect x="250" y="80" width="120" height="85" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
            <text x="310" y="135" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#34d399">+1%</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(26, 214)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1">EDIZIONE ITALIANA</text>
    <text x="350" y="16" text-anchor="end" font-family="monospace" font-size="8.5" fill="#10b981">VOL #15</text>
  </g>
</svg>